apiVersion: 1
datasources:
  - name: Pipeline Observability (Postgres)
    uid: obs-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: airflow
    secureJsonData:
      password: airflow
    jsonData:
      database: airflow
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
  - name: Airflow metrics (Prometheus)
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
