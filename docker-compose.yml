name: bank-medallion

x-airflow-common: &airflow-common
  build: .
  image: bank-medallion-airflow:1.0
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW_TIMEZONE:-UTC}
    AIRFLOW__WEBSERVER__SECRET_KEY: "change-me-secret"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    # --- monitoring: Airflow publishes StatsD metrics -> statsd-exporter -> Prometheus -> Grafana
    AIRFLOW__METRICS__STATSD_ON: "True"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    PYTHONPATH: /opt/airflow/include
    DATA_DIR: /opt/airflow/data
    SPARK_LOCAL_IP: 127.0.0.1
    SPARK_MASTER: ${SPARK_MASTER:-local[2]}
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
    # --- e-mail (unchanged)
    NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
    SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_MAIL_FROM: ${SMTP_MAIL_FROM:-}
    # --- source data: downloaded straight from Kaggle by the first task (credentials stay in .env, never in git)
    DATA_SOURCE: ${DATA_SOURCE:-kaggle}
    KAGGLE_DATASET: ${KAGGLE_DATASET:-salikhussaini49/bank-dataset}
    KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
    KAGGLE_KEY: ${KAGGLE_KEY:-}
    KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
    ALLOW_LOCAL_FALLBACK: ${ALLOW_LOCAL_FALLBACK:-true}
    # --- observability store + alert routing
    OBS_DB_DSN: postgresql://airflow:airflow@postgres:5432/airflow
    ALERT_CHANNELS: ${ALERT_CHANNELS:-email,teams}
    ALERT_MIN_SEVERITY: ${ALERT_MIN_SEVERITY:-WARNING}
    ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-360}
    TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-http://localhost:8080}
    GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
    PIPELINE_SLA_MINUTES: ${PIPELINE_SLA_MINUTES:-30}
    WATCHDOG_MAX_HOURS_SINCE_SUCCESS: ${WATCHDOG_MAX_HOURS_SINCE_SUCCESS:-30}
    # --- data-quality thresholds (see MONITORING.md)
    MAX_QUARANTINE_PCT: ${MAX_QUARANTINE_PCT:-5.0}
    MAX_NULL_PCT: ${MAX_NULL_PCT:-1.0}
    ORPHAN_MAX_PCT: ${ORPHAN_MAX_PCT:-0}
    VOLUME_WARN_PCT: ${VOLUME_WARN_PCT:-30}
    VOLUME_FAIL_PCT: ${VOLUME_FAIL_PCT:-60}
    VOLUME_MIN_HISTORY: ${VOLUME_MIN_HISTORY:-3}
    DRIFT_Z_THRESHOLD: ${DRIFT_Z_THRESHOLD:-3}
    DRIFT_MIN_HISTORY: ${DRIFT_MIN_HISTORY:-5}
    FRESHNESS_MAX_HOURS: ${FRESHNESS_MAX_HOURS:-0}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./scripts:/opt/airflow/scripts
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  statsd-exporter:
    image: prom/statsd-exporter:v0.26.1
    command:
      - --statsd.mapping-config=/etc/statsd/mapping.yml
      - --statsd.listen-udp=:9125
      - --web.listen-address=:9102
    volumes:
      - ./monitoring/statsd/mapping.yml:/etc/statsd/mapping.yml:ro
    mem_limit: 64m

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true) && python /opt/airflow/scripts/init_obs.py"
    depends_on:
      postgres:
        condition: service_healthy
      statsd-exporter:
        condition: service_started

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      statsd-exporter:
        condition: service_started

  scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      statsd-exporter:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=14d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 384m
    depends_on:
      - statsd-exporter

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline_health.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started

volumes:
  pgdata:
  promdata:
  grafanadata:
